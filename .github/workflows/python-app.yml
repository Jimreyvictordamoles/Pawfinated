name: Build Pawffinated App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------
  # 1. macOS Build Job (Generates a Universal2 App Bundle)
  # -----------------------------------------------------------------
  build-macos:
    name: Build on macOS (Universal2)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 psycopg2-binary pyinstaller

      - name: Build macOS App Bundle
        run: |
          # --target-arch universal2 forces a slice that matches both Intel and ARM64 Apple Silicon
          # --windowed ensures it builds a clickable UI bundle (Login.app) instead of a terminal script
          # --noconsole prevents a secondary black terminal window from opening behind your login app
          pyinstaller --windowed --noconsole --target-arch universal2 Login.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAWFFINATED-macos-apple-silicon
          path: dist/Login.app/

  # -----------------------------------------------------------------
  # 2. Linux & Linux Tablet Build Job (Generates x64 and ARM64 Binaries)
  # -----------------------------------------------------------------
  build-linux:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-latest for Desktop, ubuntu-latest-arm64 for Tablet environments
        os: [ubuntu-latest, ubuntu-latest-arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      # Necessary setup step to emulate ARM64 instructions on standard GitHub runners
      - name: Set up QEMU (Required for Tablet Build)
        if: matrix.os == 'ubuntu-latest-arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Matches the python architecture to the runner architecture
          architecture: ${{ matrix.os == 'ubuntu-latest-arm64' && 'arm64' || 'x64' }}

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgl1 libglx0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0
    
      - name: Install PyInstaller and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psycopg2-binary PyQt6
        
      - name: Build with PyInstaller (Linux & Tablet)
        run: |
          pyinstaller --onefile --noconfirm --name=Pawffinated-app Login.py
          # Case-insensitive wildcard copies to bypass case errors
          cp *[Dd]esktop dist/ 2>/dev/null || cp *.desktop dist/
          cp *[Pp][Nn][Gg] dist/ 2>/dev/null || cp *.png dist/
        
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PAWFFINATED-${{ matrix.os }}
          path: dist/
