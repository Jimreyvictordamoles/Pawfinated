name: Build Pawffinated App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 psycopg2-binary pyinstaller

      - name: Build macOS App Bundle
        run: |
          # --collect-all PyQt6 ensures all UI libraries are bundled so the app doesn't crash on startup
          pyinstaller --windowed --noconsole --target-arch arm64 --collect-all PyQt6 Login.py

      - name: Compress App Bundle for macOS
        run: |
          # 'ditto' is a native Mac tool that preserves the app structure and permissions perfectly
          ditto -c -k --sequesterRsrc --keepParent dist/Login.app dist/PAWFFINATED-macos.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAWFFINATED-macos-apple-silicon
          path: dist/PAWFFINATED-macos.zip
