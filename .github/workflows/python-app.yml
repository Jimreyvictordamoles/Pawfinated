name: Build Mac and Linux Apps
on: [push]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Linux GUI Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1-mesa-dev libgl1 libglx0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0
    
    - name: Install PyInstaller and Dependencies
      run: |
        pip install pyinstaller
        pip install psycopg2-binary
        pip install PyQt5  # Change to PyQt6 if needed
        
    - name: Build with PyInstaller (Mac)
      if: matrix.os == 'macos-latest'
      run: pyinstaller --windowed --noconfirm --icon=logo.icns Login.py

    - name: Build with PyInstaller (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        # --name renames the output file to match our .desktop shortcut expectations
        pyinstaller --onefile --noconfirm --name=pawfinated-app Login.py
        # Copy the icon and desktop file into the dist folder so they get zipped together
        cp app_logo.png dist/
        cp pawfinated.desktop dist/
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PAWFINATED-${{ matrix.os }}
        path: dist/
