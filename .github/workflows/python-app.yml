jobs:
  build-mac:
    # CHANGE THIS LINE: 
    # Swap out 'macos-latest' for an explicit target like 'macos-14' or 'macos-15'
    runs-on: macos-15  
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install PyQt6 psycopg2-binary pyinstaller

      - name: Build with PyInstaller
        run: |
          # The --target-arch universal2 flag forces PyInstaller to create a 
          # "Universal" binary that runs perfectly on BOTH Intel and Apple Silicon Macs!
          pyinstaller --windowed --target-arch universal2 Login.py
